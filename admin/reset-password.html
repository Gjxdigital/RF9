<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset Password — RF9 CRM</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/assets/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>

<div class="auth">
  <div class="auth__card">
    <div class="auth__brand">
      <img src="/assets/logo.svg" alt="">
      <span>RF9</span>
    </div>
    <h1 class="auth__title">Set a New Password</h1>
    <p class="auth__sub" id="resetSub">Choose a new password for your RF9 staff account.</p>

    <div class="auth__msg is-error hidden" id="resetMsg" role="alert"></div>

    <form id="resetForm" novalidate>
      <div class="field">
        <label for="newPassword">New password</label>
        <input id="newPassword" name="password" type="password" autocomplete="new-password" minlength="8" required>
      </div>
      <div class="field">
        <label for="confirmPassword">Confirm password</label>
        <input id="confirmPassword" name="confirm" type="password" autocomplete="new-password" minlength="8" required>
      </div>
      <button class="btn btn--primary btn--block" type="submit" id="resetBtn">
        <span class="btn__label">Update Password</span>
        <span class="spinner" aria-hidden="true"></span>
      </button>
    </form>

    <p class="auth__foot"><a href="/admin/login.html">Back to sign in</a></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/assets/supabase-client.js"></script>
<script>
(function () {
  'use strict';

  function setLoading(btn, loading) {
    btn.disabled = loading;
    btn.classList.toggle('is-loading', loading);
  }
  function showMsg(kind, text) {
    var box = document.getElementById('resetMsg');
    box.className = 'auth__msg is-' + kind;
    box.textContent = text;
    box.hidden = false;
  }

  var form = document.getElementById('resetForm');

  // Supabase's recovery link signs the visitor in via a PASSWORD_RECOVERY
  // event (token arrives in the URL hash and is consumed automatically by
  // supabase-js). Until that fires, there's no valid session to update.
  var ready = false;
  window.rf9Supabase.auth.onAuthStateChange(function (event) {
    if (event === 'PASSWORD_RECOVERY') ready = true;
  });
  window.rf9Supabase.auth.getSession().then(function (res) {
    if (res.data && res.data.session) ready = true;
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var pw = document.getElementById('newPassword').value;
    var confirm = document.getElementById('confirmPassword').value;
    var btn = document.getElementById('resetBtn');

    if (pw.length < 8) {
      showMsg('error', 'Password must be at least 8 characters.');
      return;
    }
    if (pw !== confirm) {
      showMsg('error', 'Passwords do not match.');
      return;
    }
    if (!ready) {
      showMsg('error', 'This reset link is invalid or has expired. Please request a new one from the sign-in page.');
      return;
    }

    setLoading(btn, true);
    window.rf9Supabase.auth.updateUser({ password: pw }).then(function (res) {
      setLoading(btn, false);
      if (res.error) {
        showMsg('error', 'Could not update your password. Please request a new reset link.');
        return;
      }
      window.location.replace('/admin/index.html');
    }).catch(function () {
      setLoading(btn, false);
      showMsg('error', 'Something went wrong. Please try again.');
    });
  });
})();
</script>
</body>
</html>
